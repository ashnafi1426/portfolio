<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CV Download Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        button {
            padding: 15px 30px;
            margin: 10px;
            font-size: 16px;
            cursor: pointer;
            background: #6366f1;
            color: white;
            border: none;
            border-radius: 8px;
        }
        button:hover {
            background: #4f46e5;
        }
        .info {
            background: #f3f4f6;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
        }
        .error {
            background: #fee;
            color: #c00;
            padding: 10px;
            border-radius: 4px;
            margin: 10px 0;
        }
        .success {
            background: #efe;
            color: #060;
            padding: 10px;
            border-radius: 4px;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <h1>CV Download Test Page</h1>
    
    <div class="info">
        <h3>Test Methods:</h3>
        <p>This page tests different methods to download the CV (pro.pdf)</p>
    </div>

    <button onclick="testFetch()">Test 1: Fetch Method</button>
    <button onclick="testDirectLink()">Test 2: Direct Link</button>
    <button onclick="testOpenTab()">Test 3: Open in New Tab</button>
    <button onclick="testViewPDF()">Test 4: View PDF Inline</button>

    <div id="result"></div>
    <div id="pdfViewer"></div>

    <script>
        const pdfPath = '/cv/pro.pdf';
        const resultDiv = document.getElementById('result');
        const pdfViewer = document.getElementById('pdfViewer');

        function showResult(message, isError = false) {
            const div = document.createElement('div');
            div.className = isError ? 'error' : 'success';
            div.textContent = message;
            resultDiv.appendChild(div);
            console.log(message);
        }

        async function testFetch() {
            resultDiv.innerHTML = '';
            pdfViewer.innerHTML = '';
            
            try {
                showResult('Testing fetch method...');
                const response = await fetch(pdfPath);
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const blob = await response.blob();
                showResult(`✓ Fetch successful! Blob size: ${blob.size} bytes, Type: ${blob.type}`);
                
                const url = window.URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = 'Ashenafi_Sileshi_Resume.pdf';
                link.click();
                
                setTimeout(() => window.URL.revokeObjectURL(url), 100);
                showResult('✓ Download initiated!');
            } catch (error) {
                showResult(`✗ Fetch failed: ${error.message}`, true);
            }
        }

        function testDirectLink() {
            resultDiv.innerHTML = '';
            pdfViewer.innerHTML = '';
            
            try {
                showResult('Testing direct link method...');
                const link = document.createElement('a');
                link.href = pdfPath;
                link.download = 'Ashenafi_Sileshi_Resume.pdf';
                link.target = '_blank';
                link.click();
                showResult('✓ Direct link download initiated!');
            } catch (error) {
                showResult(`✗ Direct link failed: ${error.message}`, true);
            }
        }

        function testOpenTab() {
            resultDiv.innerHTML = '';
            pdfViewer.innerHTML = '';
            
            try {
                showResult('Testing open in new tab...');
                const newWindow = window.open(pdfPath, '_blank');
                if (newWindow) {
                    showResult('✓ PDF opened in new tab!');
                } else {
                    showResult('✗ Pop-up blocked! Please allow pop-ups.', true);
                }
            } catch (error) {
                showResult(`✗ Open tab failed: ${error.message}`, true);
            }
        }

        async function testViewPDF() {
            resultDiv.innerHTML = '';
            pdfViewer.innerHTML = '';
            
            try {
                showResult('Testing PDF viewer...');
                const response = await fetch(pdfPath);
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                
                const blob = await response.blob();
                showResult(`✓ PDF loaded! Size: ${blob.size} bytes`);
                
                const url = window.URL.createObjectURL(blob);
                const iframe = document.createElement('iframe');
                iframe.src = url;
                iframe.style.width = '100%';
                iframe.style.height = '600px';
                iframe.style.border = '1px solid #ccc';
                iframe.style.marginTop = '20px';
                pdfViewer.appendChild(iframe);
                
                showResult('✓ PDF displayed below!');
            } catch (error) {
                showResult(`✗ View PDF failed: ${error.message}`, true);
            }
        }

        // Auto-test on load
        window.addEventListener('load', async () => {
            showResult('Page loaded. Testing PDF accessibility...');
            try {
                const response = await fetch(pdfPath);
                if (response.ok) {
                    const blob = await response.blob();
                    showResult(`✓ PDF is accessible! Size: ${blob.size} bytes, Type: ${blob.type}`);
                } else {
                    showResult(`✗ PDF not accessible: HTTP ${response.status}`, true);
                }
            } catch (error) {
                showResult(`✗ Error checking PDF: ${error.message}`, true);
            }
        });
    </script>
</body>
</html>
